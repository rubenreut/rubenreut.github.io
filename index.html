<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cube Crunch</title>
<meta name="description" content="Cube Crunch: a 3D block puzzle game for iPhone.">
<style>
  :root { --bg: #272b70; --bg2: #3a3f9e; --fg: #ffffff; --muted: #c9ccf2; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 50% 30%, var(--bg2), var(--bg)); color: var(--fg);
         font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: flex; align-items: center; justify-content: center; }
  main { max-width: 560px; padding: 48px 16px; text-align: center; }
  img { width: 128px; height: 128px; border-radius: 28px; box-shadow: 0 12px 32px rgba(0,0,0,.35); }
  h1 { font-size: 40px; margin: 24px 0 4px; letter-spacing: .5px; }
  .tag { color: var(--muted); margin: 0 0 24px; }
  .soon { display: inline-block; padding: 10px 20px; border-radius: 999px; background: rgba(255,255,255,.14); font-weight: 600; }
  footer { margin-top: 40px; font-size: 14px; color: var(--muted); }
  a { color: var(--fg); }
</style>
</head>
<body>
<main>
  <img src="cube-crunch-icon.png" alt="Cube Crunch app icon">
  <h1>Cube Crunch</h1>
  <p class="tag">A 3D block puzzle. Drop blocks, clear lines, chase combos.</p>
  <span class="soon">Coming soon to the App Store</span>
  <footer>Made by Ruben Reut, Ireland</footer>
</main>
</body>
</html>
